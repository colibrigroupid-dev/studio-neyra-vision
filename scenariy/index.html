<!doctype html>
<html lang="ru" data-lang="ru">
<head>
<meta charset="utf-8">
<title>Neyra Writer · Neyra Vision Studio</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Сценарная Neyra Vision Studio: лист сценария как в профессиональных программах, Tab и Enter переключают абзацы, сцены и хронометраж, помощник NEYRA.">
<meta name="theme-color" content="#1c1a16">
<meta name="robots" content="noindex">
<meta property="og:title" content="Сценарная · Neyra Vision Studio">
<meta property="og:description" content="Редактор сценария на русском и казахском: лист, сцены, хронометраж, NEYRA.">
<meta property="og:image" content="https://studio.neyra.vision/assets/og-scenariy.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:type" content="website"><meta property="og:url" content="https://studio.neyra.vision/scenariy/">
<link rel="icon" href="../assets/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;500;600&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=59">
</head>
<body>
<noscript><div class="nojs">Сценарная работает только с включённым JavaScript.</div></noscript>
<div class="app">
  <header class="top">
    <button class="ic" id="btnMenu" type="button" aria-label="Меню" title="Меню: проекты, импорт, экспорт, сервер">≡</button>
    <a class="brand" href="../" title="На главную studio.neyra.vision"><img src="../assets/logo-nv-512.png" alt="" width="26" height="26"><b>Neyra Vision</b></a>
    <input class="title-in" id="title" type="text" placeholder="Название проекта" data-tp="Жоба атауы" aria-label="Название проекта" spellcheck="false">
    <nav class="pages" aria-label="Отделы">
      <span class="pg on">Writer</span>
      <a class="pg" id="lnkArt" href="../studio/">Art</a>
      <a class="pg" id="lnkDirector" href="../studio/">Director</a>
      <a class="pg" id="lnkProduction" href="../studio/">Production</a>
    </nav>
    <span class="state" id="aiState" title=""><span class="dot" id="aiDot"></span><span id="aiStateText" data-t="проверяю связь">проверяю связь</span></span>
    <button class="ic mob" id="mobNav" type="button" aria-label="Навигатор">☰</button>
  </header>

  <div class="main">
    <aside class="nav" id="nav">
      <div class="nav-b">
        <div class="docs" id="docs">
          <button type="button" class="doc-i" data-doc="chars"><i>☺</i><span data-t="Персонажи">Персонажи</span><small id="charsCount"></small></button>
          <button type="button" class="doc-i" data-doc="locs"><i>⌂</i><span data-t="Локации">Локации</span><small id="locsCount"></small></button>
          <div class="doc-g"><i>▾</i><span data-t="Сценарий">Сценарий</span></div>
          <button type="button" class="doc-i sub" data-doc="title"><i>▤</i><span data-t="Титульная страница">Титульная страница</span></button>
          <button type="button" class="doc-i sub" data-doc="synopsis"><i>≣</i><span data-t="Синопсис">Синопсис</span></button>
          <button type="button" class="doc-i sub" data-doc="treatment"><i>☷</i><span data-t="Поэпизодник">Поэпизодник</span></button>
          <button type="button" class="doc-i sub on" data-doc="script"><i>✎</i><span data-t="Сценарий">Сценарий</span></button>
          <button type="button" class="doc-i sub" data-doc="stats"><i>▦</i><span data-t="Статистика">Статистика</span></button>
          <div id="userDocs"></div>
          <button type="button" class="doc-i" data-doc="trash"><i>🗑</i><span data-t="Корзина">Корзина</span><small id="trashCount"></small></button>
          <button type="button" class="doc-i add" id="addDoc"><i>+</i><span data-t="Добавить документ">Добавить документ</span></button>
        </div>
        <div class="scenes hidden" id="scenesPane">
          <div class="caps" style="padding:.6rem .7rem .2rem" data-t="Сцены">Сцены</div>
          <ul class="scene-list" id="scenes"></ul>
        </div>
      </div>
      <button type="button" class="nav-f" id="counter" title="Что считать"><span id="counterText">Длительность: 0:00</span> <span class="caret">▾</span></button>
      <div class="nav-store" id="storeNote"></div>
    </aside>

    <section class="work" id="work">
      <div class="tb" id="tb">
        <button type="button" class="ic" id="btnUndo" title="Отменить (⌘Z)">↶</button>
        <button type="button" class="ic" id="btnRedo" title="Повторить (⌘⇧Z)">↷</button>
        <span class="sep"></span>
        <select id="ptype" class="ptype" aria-label="Тип абзаца">
          <option value="scene_heading" data-t="Заголовок сцены">Заголовок сцены</option>
          <option value="scene_characters" data-t="Участники сцены">Участники сцены</option>
          <option value="action" data-t="Описание действия">Описание действия</option>
          <option value="character" data-t="Персонаж">Персонаж</option>
          <option value="parenthetical" data-t="Ремарка">Ремарка</option>
          <option value="dialogue" data-t="Реплика">Реплика</option>
          <option value="lyrics" data-t="Лирика">Лирика</option>
          <option value="shot" data-t="Кадр">Кадр</option>
          <option value="transition" data-t="Переход">Переход</option>
          <option value="inline_note" data-t="Заметка по тексту">Заметка по тексту</option>
          <option value="unformatted_text" data-t="Простой текст">Простой текст</option>
          <option value="sequence_heading" data-t="Группа (эпизод)">Группа (эпизод)</option>
          <option value="act_heading" data-t="Акт">Акт</option>
          <option value="page_break" data-t="Разрыв страницы">Разрыв страницы</option>
        </select>
        <span class="sep"></span>
        <button type="button" class="ic" id="btnFocus" title="Только лист (⌘⇧F)">⛶</button>
        <button type="button" class="ic" id="btnPaper" title="Бумага: светлая / графит">◐</button>
        <button type="button" class="ic wand" id="btnNeyra" title="NEYRA — помощник">✦</button>
        <button type="button" class="ic" id="btnScene" title="Параметры сцены">☰</button>
        <button type="button" class="ic" id="btnHelp" title="Клавиши">?</button>
        <span class="save" id="saveState" data-t="сохранено">сохранено</span>
      </div>

      <div class="view" id="view-script">
        <div class="sheet-host"><div class="sheet" id="editor" data-placeholder="ИНТ. МЕСТО - ВРЕМЯ"></div></div>
      </div>
      <div class="view doc hidden" id="view-title">
        <div class="card"><h2 data-t="Титульная страница">Титульная страница</h2>
          <label><span data-t="Название">Название</span><input id="t-title" type="text"></label>
          <label><span data-t="Подзаголовок / жанр">Подзаголовок / жанр</span><input id="t-credit" type="text" placeholder="сценарий · драма · короткий метр"></label>
          <label><span data-t="Автор">Автор</span><input id="t-author" type="text"></label>
          <label><span data-t="Дата черновика">Дата черновика</span><input id="t-date" type="text"></label>
          <label><span data-t="Контакты">Контакты</span><textarea id="t-contact" rows="3"></textarea></label>
        </div>
        <div class="sheet tp" id="titlePreview"></div>
      </div>
      <div class="view doc hidden" id="view-synopsis">
        <div class="card"><h2 data-t="Синопсис">Синопсис</h2>
          <label><span data-t="Логлайн">Логлайн</span><textarea id="f-logline" rows="2" placeholder="[герой с изъяном] должен [цель], иначе [ставки], но [препятствие]"></textarea></label>
          <label><span data-t="Синопсис">Синопсис</span><textarea id="f-synopsis" rows="14" placeholder="что происходит, по порядку"></textarea></label>
          <label><span data-t="Заметки">Заметки</span><textarea id="f-notes" rows="6" placeholder="решения, вопросы, что отложили"></textarea></label>
        </div>
      </div>
      <div class="view doc hidden" id="view-treatment"><div class="card" id="treatmentCard"></div></div>
      <div class="view doc hidden" id="view-trash"><div class="card" id="trashCard"></div></div>
      <div class="view doc hidden" id="view-userdoc"><div class="card"><input id="ud-title" type="text" class="ud-title" placeholder="Название документа"><textarea id="ud-text" rows="22" placeholder="Текст документа: логлайн, тритмент, заметки…"></textarea><div class="sp-ops"><button type="button" id="ud-del">Удалить документ</button></div></div></div>
      <div class="view doc hidden" id="view-stats"><div class="card" id="statsCard"></div></div>
      <div class="view doc hidden" id="view-chars"><div class="card" id="charsCard"></div></div>
      <div class="view doc hidden" id="view-locs"><div class="card" id="locsCard"></div></div>
      <div class="ruler" id="ruler"></div>
    </section>

    <aside class="scene-panel" id="scenePanel">
      <div class="sp-h"><b id="spTitle" data-t="Сцена">Сцена</b><button type="button" class="ic" id="spClose" aria-label="Скрыть">×</button></div>
      <div class="sp-b" id="spBody"></div>
    </aside>
    <aside class="neyra hidden" id="neyra">
      <div class="neyra-h"><b>NEYRA</b>
        <div class="seg tier" role="group"><button type="button" data-tier="standard" aria-pressed="true" data-t="Стандарт">Стандарт</button><button type="button" data-tier="pro" aria-pressed="false">PRO</button></div>
        <button type="button" class="ic" id="btnNeyraClose" aria-label="Закрыть">×</button>
      </div>
      <div class="ai-list" id="actions">
        <button type="button" data-act="paraphrase"><i>↻</i><span data-t="Перефразировать">Перефразировать</span></button>
        <button type="button" data-act="expand"><i>⤢</i><span data-t="Расширить">Расширить</span></button>
        <button type="button" data-act="cut"><i>⤡</i><span data-t="Сократить">Сократить</span></button>
        <button type="button" data-act="continue"><i>⎘</i><span data-t="Вставить">Вставить</span></button>
        <button type="button" data-act="summarize"><i>≡</i><span data-t="Подытожить">Подытожить</span></button>
        <button type="button" data-act="translate"><i>Ә</i><span data-t="Перевести">Перевести</span></button>
        <button type="button" data-act="logline"><i>▤</i><span data-t="Сгенерировать синопсис">Сгенерировать синопсис</span></button>
        <button type="button" data-act="coverage"><i>✎</i><span data-t="Разбор сценария">Разбор сценария</span></button>
        <button type="button" data-act="generate"><i>Тт</i><span data-t="Сгенерировать">Сгенерировать</span></button>
        <button type="button" class="more" id="aiMore"><i>…</i><span data-t="Ещё">Ещё</span></button>
        <div class="ai-extra hidden" id="aiExtra">
          <button type="button" data-act="dialogue"><i>“</i><span data-t="Диалог живее">Диалог живее</span></button>
          <button type="button" data-act="modernize"><i>⌁</i><span data-t="Модернизировать">Модернизировать</span></button>
          <button type="button" data-act="turns"><i>⑂</i><span data-t="3 поворота">3 поворота</span></button>
          <button type="button" data-act="beats"><i>▦</i><span data-t="Бит-шит">Бит-шит</span></button>
          <button type="button" data-act="continuity"><i>⟲</i><span data-t="Непрерывность">Непрерывность</span></button>
        </div>
        <div class="ai-scope"><span class="caps" data-t="Работать с">Работать с</span> <select id="scope"><option value="auto" data-t="выделение → сцена → всё">выделение → сцена → всё</option><option value="selection" data-t="выделенным">выделенным</option><option value="scene" data-t="текущей сценой">текущей сценой</option><option value="all" data-t="всем сценарием">всем сценарием</option></select><span class="what" id="scopeWhat"></span></div>
      </div>
      <div class="chat" id="chat"></div>
      <div class="ai-foot"><span id="tokenInfo"></span><a href="../studio/#/studio/overview" id="topup" data-t="пополнить">пополнить</a></div>
      <form class="ask" id="askForm"><textarea id="askIn" rows="1" placeholder="Спросить NEYRA о сценарии…" data-tp="NEYRA-дан сценарий туралы сұрау…" aria-label="Вопрос"></textarea><button class="btn btn--main btn--sm" type="submit" aria-label="Отправить">→</button></form>
    </aside>
  </div>
</div>
<input type="file" id="fileIn" accept=".fountain,.txt,.md,.fdx,.json,.docx,.pdf" class="hidden">
<div class="toast" id="toast" role="status"></div>
<script src="fountain.js?v=59"></script>
<script src="editor.js?v=59"></script>
<script src="app.js?v=59"></script>
</body>
</html>
