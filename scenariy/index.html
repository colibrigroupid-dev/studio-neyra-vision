<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сценарий · Neyra Vision Studio</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Сценарная студии Neyra Vision: пишите сценарий в формате Fountain, держите структуру и героев, улучшайте текст с NEYRA.">
<meta name="theme-color" content="#1c1a16">
<meta name="robots" content="noindex">
<link rel="icon" href="../assets/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;500;600&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="../" title="На главную studio.neyra.vision"><img src="../assets/logo-nv-512.png" alt="" width="30" height="30"><span><b>Neyra Vision</b><small>STUDIO · СЦЕНАРИЙ</small></span></a>
    <button class="btn btn--sm mob" id="mobLeft" type="button">Сцены</button>
    <input class="title-in" id="title" type="text" placeholder="Название проекта" aria-label="Название проекта" spellcheck="false">
    <div class="stats" id="stats" aria-live="polite"></div>
    <div class="tb">
      <button class="btn btn--sm" id="btnProjects" type="button">Проекты ▾</button>
      <button class="btn btn--sm" id="btnExport" type="button">Экспорт ▾</button>
      <div class="seg" role="group" aria-label="Вид">
        <button type="button" data-view="text" aria-pressed="false">Текст</button>
        <button type="button" data-view="both" aria-pressed="true">Оба</button>
        <button type="button" data-view="page" aria-pressed="false">Страница</button>
      </div>
      <button class="btn btn--sm mob" id="mobRight" type="button">NEYRA</button>
    </div>
  </header>

  <div class="main">
    <aside class="pane left">
      <div class="pane-h">
        <div class="tabs" role="tablist">
          <button role="tab" aria-selected="true" data-tab="scenes">Сцены</button>
          <button role="tab" aria-selected="false" data-tab="chars">Герои</button>
          <button role="tab" aria-selected="false" data-tab="beats">Структура</button>
          <button role="tab" aria-selected="false" data-tab="notes">Замысел</button>
        </div>
      </div>
      <div class="pane-b">
        <ul class="list" id="scenes" data-panel="scenes"></ul>
        <ul class="list hidden" id="chars" data-panel="chars"></ul>
        <div class="beats hidden" id="beats" data-panel="beats"></div>
        <div class="fields hidden" id="notes" data-panel="notes">
          <label><span class="caps">Логлайн</span><textarea id="f-logline" rows="3" placeholder="[герой с изъяном] должен [цель], иначе [ставки], но [препятствие]"></textarea></label>
          <label><span class="caps">Жанр · формат</span><input id="f-genre" type="text" placeholder="драма, полный метр, 90 мин"></label>
          <label><span class="caps">Синопсис</span><textarea id="f-synopsis" rows="8" placeholder="10 строк о том, что происходит"></textarea></label>
          <label><span class="caps">Заметки</span><textarea id="f-notes" rows="6" placeholder="решения, вопросы, что отложили"></textarea></label>
        </div>
      </div>
    </aside>

    <section class="pane center">
      <div class="ed-tools" id="edTools">
        <button type="button" data-ins="heading-int">ИНТ.</button>
        <button type="button" data-ins="heading-ext">НАТ.</button>
        <button type="button" data-ins="character">ГЕРОЙ</button>
        <button type="button" data-ins="paren">(ремарка)</button>
        <button type="button" data-ins="transition">ПЕРЕХОД</button>
        <button type="button" data-ins="title">ТИТР</button>
        <button type="button" data-ins="note">[[заметка]]</button>
        <button type="button" data-ins="section">#Акт</button>
        <button type="button" data-ins="pagebreak">=== разрыв</button>
        <span style="margin-left:auto" class="caps" id="saveState">сохранено</span>
      </div>
      <div class="ed-wrap both" id="edWrap">
        <div class="ed"><textarea id="src" spellcheck="true" placeholder="Title: Название&#10;Author: Автор&#10;&#10;ИНТ. КУХНЯ — НОЧЬ&#10;&#10;Тусклый свет над плитой. АЙГЕРИМ (30) смотрит на закрытую дверь.&#10;&#10;АЙГЕРИМ&#10;(тихо)&#10;Ты обещал."></textarea></div>
        <div class="pv" id="pv"><div class="sp" id="page"></div></div>
      </div>
    </section>

    <aside class="pane right">
      <div class="pane-h ai-h"><span class="dot" id="aiDot"></span><b style="font-weight:500">NEYRA</b><span class="caps" id="aiState">проверяю связь</span></div>
      <div class="scope">
        <span class="caps">Работать с</span>
        <select id="scope" aria-label="Область">
          <option value="auto">выделение → сцена → всё</option>
          <option value="selection">выделенным</option>
          <option value="scene">текущей сценой</option>
          <option value="all">всем сценарием</option>
        </select>
        <span class="what" id="scopeWhat"></span>
      </div>
      <div class="actions" id="actions">
        <button type="button" data-act="coverage" class="wide">Читательское заключение<small>весь сценарий: что работает, что ломается, вопросы автору</small></button>
        <button type="button" data-act="beats">Бит-шит<small>15 битов, где дыра</small></button>
        <button type="button" data-act="continuity">Непрерывность<small>имена, время, ружья</small></button>
        <button type="button" data-act="improve">Улучшить сцену<small>цель · препятствие · перемена</small></button>
        <button type="button" data-act="dialogue">Диалог живее<small>подтекст, голоса героев</small></button>
        <button type="button" data-act="modernize">Модернизировать<small>в наше время и язык</small></button>
        <button type="button" data-act="turns">3 поворота<small>варианты для сцены</small></button>
        <button type="button" data-act="logline">Логлайн и синопсис<small>в карточку «Замысел»</small></button>
        <button type="button" data-act="kazakh">На казахский<small>перевод с форматом</small></button>
        <button type="button" data-act="expand">Расписать<small>из синопсиса или заметки — сцены</small></button>
        <button type="button" data-act="cut">Сжать<small>входи поздно, выходи рано</small></button>
      </div>
      <div class="chat" id="chat"></div>
      <form class="ask" id="askForm">
        <textarea id="askIn" rows="1" placeholder="Спросить NEYRA о сценарии…" aria-label="Вопрос"></textarea>
        <button class="btn btn--main btn--sm" type="submit">→</button>
      </form>
    </aside>
  </div>
</div>
<input type="file" id="fileIn" accept=".fountain,.txt,.md,.fdx,.json" class="hidden">
<div class="toast" id="toast" role="status"></div>
<script src="fountain.js"></script>
<script src="app.js"></script>
</body>
</html>
