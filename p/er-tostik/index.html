<style>
:root{--bg:oklch(0.15 0.014 60);--accent:oklch(0.80 0.12 70);--bg-2:color-mix(in oklch,var(--bg) 92%,white);--surface:color-mix(in oklch,var(--bg) 86%,white);--line:color-mix(in oklch,var(--bg) 70%,white);--line-soft:color-mix(in oklch,var(--bg) 80%,white);--text:oklch(0.95 0.008 85);--muted:oklch(0.74 0.012 85);--dim:oklch(0.66 0.012 85);--accent-ink:oklch(0.18 0.03 80);--ok:oklch(0.78 0.14 150);--warn:var(--accent);--bad:oklch(0.76 0.16 25);--disp:"Geologica","Onest",system-ui,sans-serif;--body:"Onest",system-ui,sans-serif;--mono:"PT Mono",ui-monospace,Menlo,monospace;--step-0:clamp(1rem,0.96rem + 0.22vw,1.15rem);--step-1:clamp(1.2rem,1.08rem + 0.6vw,1.6rem);--step-2:clamp(1.5rem,1.25rem + 1.3vw,2.3rem);--step-3:clamp(2rem,1.45rem + 2.8vw,3.4rem);--gutter:clamp(1rem,4vw,3rem);--section:clamp(4rem,9vw,8rem);--ease-out:cubic-bezier(0.16,1,0.3,1);color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:400 var(--step-0)/1.55 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--accent);color:var(--accent-ink)}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
img{display:block;max-width:100%}a{color:inherit}
h1,h2,h3,h4{font-family:var(--disp);font-weight:500;line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
h1{font-size:clamp(2.6rem,1.4rem + 7vw,7rem);line-height:.95;font-weight:600}h2{font-size:var(--step-3);margin:.6rem 0 1.4rem}h3{font-size:var(--step-1);margin:1.6rem 0 .5rem}h4{font-size:var(--step-0);margin:1.2rem 0 .4rem;color:var(--muted)}
p{margin:0;text-wrap:pretty}.wrap{width:min(100% - 2*var(--gutter),1200px);margin-inline:auto}section{padding-block:var(--section)}
.caps{font-family:var(--mono);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:.5em;min-height:48px;padding:.75em 1.4em;border-radius:999px;border:1px solid transparent;font:500 var(--step-0)/1 var(--body);text-decoration:none;cursor:pointer;background:transparent;color:var(--text);transition:transform .2s var(--ease-out),background-color .2s}
.btn--main{background:var(--accent);color:var(--accent-ink)}.btn--ghost{border-color:var(--line)}.btn:active{transform:scale(.97)}
/* шапка */
.top{position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);background:color-mix(in oklch,var(--bg) 80%,transparent);border-bottom:1px solid var(--line-soft)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:60px}
.top a.brand{font:600 .9rem/1 var(--disp);letter-spacing:.14em;text-transform:uppercase;text-decoration:none}.top nav{display:flex;gap:1rem;flex-wrap:wrap}
.top nav a{font-size:.9rem;color:var(--muted);text-decoration:none;white-space:nowrap}.top nav a:hover{color:var(--text)}
@media (max-width:760px){.top nav{display:none}}
/* замок */
.gate-screen{min-height:100svh;display:grid;place-items:center;padding:var(--gutter)}
.gate{display:grid;gap:.8rem;width:min(100%,420px)}.gate input{font:500 1.1rem var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:.9em 1em;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);min-height:48px}
.gate .err{color:var(--bad);font-size:.95rem;min-height:1.4em}.gate--inline{grid-template-columns:1fr auto;align-items:center}
.gate-screen h1{font-size:var(--step-3);font-weight:500}
/* первый экран тайтла */
.title-hero{position:relative;min-height:92svh;display:grid;align-content:end;overflow:hidden}
.title-hero__art{position:absolute;inset:0}.title-hero__art img{width:100%;height:100%;object-fit:cover}
.title-hero__art::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 0%,color-mix(in oklch,var(--bg) 85%,transparent) 32%,color-mix(in oklch,var(--bg) 35%,transparent) 62%,transparent 100%),linear-gradient(to right,color-mix(in oklch,var(--bg) 70%,transparent),transparent 70%)}
.title-hero__body{text-shadow:0 1px 2px rgb(0 0 0/.5),0 2px 24px rgb(0 0 0/.45)}.title-hero__body .caps{color:var(--text);opacity:.85}
.title-hero__body{position:relative;padding-block:0 clamp(2rem,6vh,5rem);display:grid;gap:1rem;max-width:64ch}
.meta{display:flex;flex-wrap:wrap;list-style:none;margin:0;padding:0;color:var(--muted);font-variant-numeric:tabular-nums}.meta li+li::before{content:"·";margin-inline:.6em;color:var(--line)}
.logline{font-size:var(--step-1);line-height:1.35;max-width:52ch}.actions{display:flex;flex-wrap:wrap;gap:.6rem}.credits-line{color:var(--muted)}.credits-line b{color:var(--text);font-weight:500}
@media (prefers-reduced-motion:no-preference){.title-hero__art img{animation:breathe 9s var(--ease-out) both}@keyframes breathe{from{transform:scale(1.06)}to{transform:scale(1)}}}
/* путь */
.put{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--line)}
.put li{display:grid;grid-template-columns:3rem 1fr auto;gap:1rem;align-items:center;padding:1rem 0;border-bottom:1px solid var(--line-soft);color:var(--dim)}
.put li .n{font-family:var(--mono)}.put li .t b{display:block;color:var(--muted);font-weight:500}.put li .t small{color:var(--dim)}
.put li.done{color:var(--ok)}.put li.done .t b{color:var(--text)}.put li.now .t b{color:var(--text)}.put li.now .n{color:var(--accent)}.put li.now{background:color-mix(in oklch,var(--accent) 6%,transparent);margin-inline:-1rem;padding-inline:1rem}
.gate{font-family:var(--mono);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}.put .gate{font-family:var(--mono)}
/* карта производства */
.karta{overflow-x:auto;margin-top:1.5rem;border:1px solid var(--line);border-radius:8px}.karta table{border-collapse:collapse;min-width:900px;width:100%;font-size:.92rem}
.karta th{font-family:var(--mono);font-weight:400;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:.7rem .6rem;border-bottom:1px solid var(--line);text-align:left;background:var(--bg-2)}
.karta th[scope=row]{font-family:var(--body);font-size:.95rem;letter-spacing:0;text-transform:none;color:var(--text);background:transparent;white-space:nowrap}
.karta td{padding:.6rem .6rem;border-bottom:1px solid var(--line-soft);border-left:1px solid var(--line-soft);vertical-align:top;color:var(--muted);min-width:7.5rem}
.karta tr:last-child td{border-bottom:0}.karta .k__sym{display:inline-block;width:1.3em;font-family:var(--mono)}.karta .k__txt{font-size:.88rem}
.karta td.e{color:var(--dim)}.karta td.w{color:var(--text);background:color-mix(in oklch,var(--accent) 7%,transparent)}.karta td.w .k__sym{color:var(--accent)}.karta td.d{color:var(--text)}.karta td.d .k__sym,.karta td.a .k__sym{color:var(--ok)}.karta td.a{color:var(--text);background:color-mix(in oklch,var(--ok) 6%,transparent)}.karta td.r{color:var(--text);background:color-mix(in oklch,var(--bad) 10%,transparent)}.karta td.r .k__sym{color:var(--bad)}
/* документы */
.grid2{display:grid;gap:3rem;grid-template-columns:1fr}@media (min-width:900px){.grid2{grid-template-columns:7fr 5fr}}
.doc{max-width:72ch}.doc p{margin:0 0 1em;color:var(--muted)}.doc b{color:var(--text);font-weight:500}.doc ul,.doc ol{margin:0 0 1em;padding-left:1.2em;color:var(--muted)}.doc li{margin:.25em 0}
.doc.big p{font-family:var(--disp);font-size:var(--step-2);line-height:1.15;color:var(--text);font-weight:300}.doc.cols{max-width:none;columns:2;column-gap:3rem}@media (max-width:860px){.doc.cols{columns:1}}
.doc .red{color:var(--accent)}.doc .lena{color:var(--ok)}.doc code{font-family:var(--mono);font-size:.9em;color:var(--dim)}
.podzag{color:var(--dim);font-style:italic;margin-top:1rem}
.tbl{overflow-x:auto;margin:0 0 1.5em;max-width:none}.tbl table{border-collapse:collapse;width:100%;font-size:.95rem;min-width:640px}.tbl th{text-align:left;font-family:var(--mono);font-weight:400;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:.6rem .6rem;border-bottom:1px solid var(--line)}.tbl td{padding:.7rem .6rem;border-bottom:1px solid var(--line-soft);vertical-align:top;color:var(--muted)}.tbl td b{color:var(--text)}
#geroi .doc,#poepizodnik .doc{max-width:none}
/* лента референсов */
.lenta{display:grid;grid-auto-flow:column;grid-auto-columns:min(80vw,520px);gap:1rem;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 max(var(--gutter),calc(50vw - 600px)) 1rem;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.clip{scroll-snap-align:start;margin:0;display:grid;gap:.5rem}.clip__frame{display:block;aspect-ratio:16/9;overflow:hidden;border-radius:6px;background:var(--surface);border:1px solid var(--line-soft)}.clip__frame img{width:100%;height:100%;object-fit:cover}.clip figcaption{font-size:.95rem;color:var(--muted)}
/* карточки кадров */
.boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.5rem 1.25rem;list-style:none;margin:0;padding:0}
.board{display:grid;gap:.6rem}.board__frame{position:relative;aspect-ratio:16/9;background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden}.board__frame img{width:100%;height:100%;object-fit:cover}
.board__id{position:absolute;left:.5rem;top:.5rem;padding:.3em .55em;background:rgb(0 0 0/.7);font:500 .8rem/1 var(--mono);border-radius:3px}
.board__st{position:absolute;right:.5rem;top:.5rem;padding:.35em .6em;background:rgb(0 0 0/.7);font:500 .8rem/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;border-radius:3px;border:1px solid transparent}
.board__st.g{color:var(--ok);border-color:color-mix(in oklch,var(--ok) 50%,transparent)}.board__st.y{color:var(--accent);border-color:color-mix(in oklch,var(--accent) 50%,transparent)}.board__st.r{color:var(--bad);border-color:color-mix(in oklch,var(--bad) 60%,transparent)}.board__st.d{color:var(--dim);border-color:var(--line)}
.board__specs{display:flex;flex-wrap:wrap;gap:.3rem .9rem;font:.8rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.board__action{color:var(--muted)}.board__note{color:var(--accent)}.board__who{color:var(--dim);font-size:.95rem}
/* команда */
.creds{display:grid;gap:.4rem;max-width:60ch}.cred{display:grid;grid-template-columns:1fr 1fr;gap:1rem;padding:.6rem 0;border-bottom:1px solid var(--line-soft)}.cred__rol{color:var(--dim)}.cred__imya{color:var(--text)}.kontakt{margin-top:2rem;color:var(--muted)}
@media (max-width:600px){.cred{grid-template-columns:1fr;gap:.1rem}}
.doc--zh h3{font-size:var(--step-0);color:var(--dim);font-family:var(--mono);font-weight:400;letter-spacing:.06em}
footer{border-top:1px solid var(--line-soft);padding:2rem 0 calc(2rem + env(safe-area-inset-bottom));color:var(--dim);font-size:.95rem}
.grain::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:99;opacity:.045;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");mix-blend-mode:overlay}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}html{scroll-behavior:auto}}
@media print{.top,.title-hero__art,.lenta,.grain::after,#smeta,footer{display:none!important}body{background:#fff;color:#111}.title-hero{min-height:auto}.boards{grid-template-columns:repeat(2,1fr)}.doc p,.tbl td{color:#222}}
</style>

<script>
(function(){
  const u=b=>{const s=atob(b),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a};
  async function dec(id,code){const P=JSON.parse(document.getElementById(id).textContent);const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(P.salt),iterations:P.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(P.iv)},k,u(P.ct)))}
  const norm=c=>(c||'').replace(/\s+/g,'').toUpperCase();
  async function open(code){
    code=norm(code); if(!code) return false;
    try{const html=await dec('payload',code);document.getElementById('app').innerHTML=html;document.getElementById('nav').hidden=false;try{sessionStorage.setItem('nv-code-'+location.pathname,code)}catch(e){};wirePro();if(location.hash){const el=document.querySelector(location.hash);el&&el.scrollIntoView()}return true}catch(e){return false}

  const form=document.getElementById('gateform');
  form.addEventListener('submit',async ev=>{ev.preventDefault();const ok=await open(form.code.value);if(!ok){document.getElementById('gateerr').textContent='Код не подошёл. Проверьте и попробуйте ещё раз.';form.code.select()}});
  const q=new URLSearchParams(location.search).get('code');let saved=null;try{saved=sessionStorage.getItem('nv-code-'+location.pathname)}catch(e){}
